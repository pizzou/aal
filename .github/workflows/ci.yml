name: AAL Production CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logiplatform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aal-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logiplatform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_DB_PASSWORD: aal-test-password
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/logiplatform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: aal-test-password
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Flyway migration numbering and static release checks
        run: |
          bash scripts/verify-migrations.sh
          bash scripts/production-preflight.sh --static-only
          bash scripts/security/csp-check.sh --static
      - name: Run backend verification
        working-directory: backend
        run: bash ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend typecheck, audit and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret and dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository dependency scan
        run: bash scripts/security/dependency-scan.sh
