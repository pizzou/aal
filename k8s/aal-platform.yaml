apiVersion: v1
kind: Namespace
metadata: {name: aal}
---
apiVersion: v1
kind: Secret
metadata: {name: aal-secrets, namespace: aal}
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aal
  SPRING_DATASOURCE_USERNAME: aal_app
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: aal}
spec:
  replicas: 2
  strategy: {type: RollingUpdate}
  selector: {matchLabels: {app: aal-backend}}
  template:
    metadata: {labels: {app: aal-backend}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: backend
          image: ghcr.io/YOUR_ORG/aal-backend:latest
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: aal-secrets}}]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}
            - {name: SPRING_DATA_REDIS_HOST, value: redis}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka:9092}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: aal}
spec: {selector: {app: aal-backend}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: aal}
spec:
  replicas: 2
  selector: {matchLabels: {app: aal-frontend}}
  template:
    metadata: {labels: {app: aal-frontend}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1001}
      containers:
        - name: frontend
          image: ghcr.io/YOUR_ORG/aal-frontend:latest
          ports: [{containerPort: 3000}]
          env: [{name: NEXT_PUBLIC_API_BASE_URL, value: https://api.example.com}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: aal}
spec: {selector: {app: aal-frontend}, ports: [{port: 3000, targetPort: 3000}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aal
  namespace: aal
  annotations: {nginx.ingress.kubernetes.io/proxy-body-size: 50m}
spec:
  ingressClassName: nginx
  tls: [{hosts: [portal.example.com, api.example.com], secretName: aal-tls}]
  rules:
    - host: portal.example.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 3000}}}}]}
    - host: api.example.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 8080}}}}]}
