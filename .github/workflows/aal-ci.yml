name: AAL — build and test (no deployment)
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Java / Flyway / integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aal_ci_postgres_only
          POSTGRES_DB: logiplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d logiplatform"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DB_PASSWORD: aal_ci_postgres_only
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify SQL migration numbering and shell syntax
        run: |
          bash scripts/verify-migrations.sh
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Maven clean verify against isolated Postgres
        working-directory: backend
        run: mvn -B clean verify
      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
  frontend:
    name: TypeScript / unit tests / production Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Regression tests
        working-directory: frontend
        run: npm run test:unit
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
  production-configuration:
    name: Validate production deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/release/check-production-config.py
      - name: Docker Compose configuration interpolation
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - run: bash scripts/production-preflight.sh --static-only
