spring.application.name=logiplatform-backend

# ---------------------------------------------------------------------------
# SERVER
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# POSTGRESQL
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:2000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}
spring.datasource.hikari.pool-name=${DB_POOL_NAME:LogiPlatformHikariPool}

# ---------------------------------------------------------------------------
# LIFECYCLE
# ---------------------------------------------------------------------------
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---------------------------------------------------------------------------
# JPA
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# FLYWAY
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# ---------------------------------------------------------------------------
# REDIS
# ---------------------------------------------------------------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}

# ---------------------------------------------------------------------------
# SMTP
# Brevo is the transactional mail provider for AAL.
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}


app.mail.enabled=${MAIL_ENABLED:${AAL_MAIL_ENABLED:false}}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:${AAL_BREVO_SENDER_EMAIL:pmpumuropizzou@gmail.com}}
app.mail.sender-name=${MAIL_FROM_NAME:${AAL_MAIL_SENDER_NAME:Aviation Africa Logistics Ltd}}
app.mail.brevo-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
app.mail.brevo-senders-url=${BREVO_SENDERS_API_URL:https://api.brevo.com/v3/senders}



# ---------------------------------------------------------------------------
# FRONTEND
# ---------------------------------------------------------------------------
app.frontend.url=${APP_FRONTEND_URL:https://aal-a.vercel.app}

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:aal-local-development-jwt-secret-change-before-production-2026}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---------------------------------------------------------------------------
# NOTIFICATIONS
# ---------------------------------------------------------------------------
notifications.smtp.enabled=${NOTIFICATIONS_SMTP_ENABLED:false}
notifications.from-address=${NOTIFICATIONS_FROM_ADDRESS:${AAL_BREVO_SENDER_EMAIL:pmpumuropizzou@gmail.com}}

# ---------------------------------------------------------------------------
# FLIGHT STATUS
# ---------------------------------------------------------------------------
flightstatus.aviationstack.enabled=${FLIGHTSTATUS_ENABLED:false}
flightstatus.aviationstack.api-key=${AVIATIONSTACK_API_KEY:}
flightstatus.aviationstack.base-url=${AVIATIONSTACK_BASE_URL:https://api.aviationstack.com/v1}

# ---------------------------------------------------------------------------
# ACTUATOR
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
logging.level.com.logiplatform=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-no-request-id}] %-5level %logger{36} - %msg%n

# ---------------------------------------------------------------------------
# AAL AIR-CARGO INTEGRATIONS
# ---------------------------------------------------------------------------
aircargo.carrier.base-url=${AIRCARGO_CARRIER_BASE_URL:}
aircargo.carrier.api-key=${AIRCARGO_CARRIER_API_KEY:}

aircargo.customs.base-url=${AIRCARGO_CUSTOMS_BASE_URL:}
aircargo.customs.broker-url=${AIRCARGO_CUSTOMS_BROKER_URL:}

aircargo.integration.api-key=${AIRCARGO_INTEGRATION_API_KEY:}

# ---------------------------------------------------------------------------
# AI PRICING
# ---------------------------------------------------------------------------
pricing.ai.enabled=${PRICING_AI_ENABLED:false}
pricing.ai.base-url=${PRICING_AI_BASE_URL:https://api.openai.com/v1}
pricing.ai.api-key=${PRICING_AI_API_KEY:}
pricing.ai.model=${PRICING_AI_MODEL:gpt-5-mini}

# ---------------------------------------------------------------------------
# SECURITY / CORS
# ---------------------------------------------------------------------------
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:https://aal-a.vercel.app}

# ---------------------------------------------------------------------------
# APPLICATION
# ---------------------------------------------------------------------------
app.environment=${APP_ENVIRONMENT:development}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.otp.required=${AAL_AUTH_OTP_REQUIRED:true}

# ---------------------------------------------------------------------------
# AFRICA LOGISTIC AVIATION - SINGLE TENANT
# ---------------------------------------------------------------------------
app.single-tenant.id=${AAL_TENANT_ID:7c7d3b7c-3f20-4d3d-9c11-6f7d8f2a6b01}
app.single-tenant.name=${AAL_TENANT_NAME:Aviation Africa Logistics Ltd}

# ---------------------------------------------------------------------------
# ADMIN CREDENTIAL SEED
# Disabled by default.
#
# For the first production deployment, set:
# AAL_ADMIN_SEED_ENABLED=true
# AAL_ADMIN_EMAIL=<admin email>
# AAL_ADMIN_PASSWORD=<admin password>
# AAL_ADMIN_DISPLAY_NAME=AAL Administrator
#
# After the admin is created, set AAL_ADMIN_SEED_ENABLED=false
# and redeploy.
# ---------------------------------------------------------------------------
app.admin-seed.enabled=${AAL_ADMIN_SEED_ENABLED:false}
app.admin-seed.email=${AAL_ADMIN_EMAIL:}
app.admin-seed.password=${AAL_ADMIN_PASSWORD:}
app.admin-seed.display-name=${AAL_ADMIN_DISPLAY_NAME:AAL Administrator}

# ---------------------------------------------------------------------------
# KAFKA / EVENT STREAMING
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.enable-idempotence=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed

# ---------------------------------------------------------------------------
# TRACING
# ---------------------------------------------------------------------------
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:false}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

# ---------------------------------------------------------------------------
# AAL EVENTS
# ---------------------------------------------------------------------------
aal.events.gps-topic=${AAL_GPS_KAFKA_TOPIC:aal.gps.position}
aal.events.kafka-enabled=${AAL_KAFKA_ENABLED:false}
# ---------------------------------------------------------------------------
# JWT ROTATION / SMS / GPS STREAMING
# ---------------------------------------------------------------------------
jwt.previous-secret=${JWT_PREVIOUS_SECRET:}
sms.twilio.enabled=${SMS_TWILIO_ENABLED:false}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
sms.twilio.base-url=${TWILIO_BASE_URL:https://api.twilio.com/2010-04-01}
aal.events.gps-consumer-group=${AAL_GPS_KAFKA_CONSUMER_GROUP:aal-gps-consumer-v1}
aal.events.gps-consumer-enabled=${AAL_GPS_KAFKA_CONSUMER_ENABLED:false}
spring.kafka.consumer.group-id=${AAL_GPS_KAFKA_CONSUMER_GROUP:aal-gps-consumer-v1}

# ---------------------------------------------------------------------------
# DOCUMENT SECURITY / SIGNATURES
# ---------------------------------------------------------------------------
document-security.clamav.enabled=${CLAMAV_ENABLED:false}
document-security.clamav.required=${CLAMAV_REQUIRED:false}
document-security.clamav.host=${CLAMAV_HOST:localhost}
document-security.clamav.port=${CLAMAV_PORT:3310}
document-security.clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:15000}
document-security.clamav.scanner-version=${CLAMAV_SCANNER_VERSION:clamav}
document-signature.provider=${DOCUMENT_SIGNATURE_PROVIDER:INTERNAL_AUDIT}
document-signature.webhook-secret=${DOCUMENT_SIGNATURE_WEBHOOK_SECRET:}


# PAYMENTS
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# ENTERPRISE INTEGRATIONS / EDI / WEBHOOKS
# ---------------------------------------------------------------------------
integration.dcsa.base-url=${DCSA_BASE_URL:}
integration.port.base-url=${PORT_EVENTS_BASE_URL:}
integration.accounting.base-url=${ACCOUNTING_API_BASE_URL:}
integration.whatsapp.base-url=${WHATSAPP_CLOUD_BASE_URL:https://graph.facebook.com}
integration.whatsapp.token=${WHATSAPP_CLOUD_TOKEN:}
integration.edi.enabled=${EDI_INTEGRATION_ENABLED:true}
integration.edi.base-url=${EDI_BASE_URL:}
integration.webhook.secret=${INTEGRATION_WEBHOOK_SECRET:}
integration.webhook.allowed-hosts=${INTEGRATION_WEBHOOK_ALLOWED_HOSTS:}
