name: AAL Production Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B -DskipTests=false test
      - name: Package
        run: mvn -B -DskipTests package
      - name: Dependency scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: aal-backend
          path: backend
          format: HTML
          args: --failOnCVSS 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aal-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t aal-frontend:${{ github.sha }} ./frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aal-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aal-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
