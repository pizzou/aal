# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:8}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      pool-name: ${DB_POOL_NAME:LogiPlatformProductionPool}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2000ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      acks: all
      enable-idempotence: true

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET:}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

security:
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:${APP_FRONTEND_URL:https://aal-a.vercel.app},https://portal.africalogisticaviation.com}

app:
  environment: production
  frontend:
    url: ${APP_FRONTEND_URL:https://aal-a.vercel.app}
  mail:
    enabled: ${AAL_MAIL_ENABLED:true}
    from: ${AAL_BREVO_SENDER_EMAIL:${NOTIFICATIONS_FROM_ADDRESS:pmpumuropizzou@gmail.com}}
    sender-name: ${AAL_MAIL_SENDER_NAME:Aviation Africa Logistics Ltd}
    brevo-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
    brevo-senders-url: ${BREVO_SENDERS_API_URL:https://api.brevo.com/v3/senders}
    brevo-api-key: ${BREVO_API_KEY:}
  auth:
    otp:
      required: true
    cookie:
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:None}

notifications:
  smtp:
    enabled: ${NOTIFICATIONS_SMTP_ENABLED:false}
  from-address: ${NOTIFICATIONS_FROM_ADDRESS:${AAL_BREVO_SENDER_EMAIL:pmpumuropizzou@gmail.com}}

flightstatus:
  aviationstack:
    enabled: ${FLIGHTSTATUS_ENABLED:false}
    api-key: ${AVIATIONSTACK_API_KEY:}
    base-url: ${AVIATIONSTACK_BASE_URL:https://api.aviationstack.com/v1}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

aal:
  events:
    gps-topic: ${AAL_GPS_KAFKA_TOPIC:aal.gps.position}
    gps-consumer-group: ${AAL_GPS_KAFKA_CONSUMER_GROUP:aal-gps-consumer-v1}
    kafka-enabled: ${AAL_KAFKA_ENABLED:false}
    gps-consumer-enabled: ${AAL_GPS_KAFKA_CONSUMER_ENABLED:false}

sms:
  twilio:
    enabled: ${SMS_TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    base-url: ${TWILIO_BASE_URL:https://api.twilio.com}

document-security:
  clamav:
    enabled: ${CLAMAV_ENABLED:true}
    required: ${CLAMAV_REQUIRED:true}
    host: ${CLAMAV_HOST:clamav}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:15000}
    scanner-version: ${CLAMAV_SCANNER_VERSION:clamav}

document-signature:
  provider: ${DOCUMENT_SIGNATURE_PROVIDER:INTERNAL_AUDIT}
  webhook-secret: ${DOCUMENT_SIGNATURE_WEBHOOK_SECRET:}

paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}

integration:
  dcsa:
    base-url: ${DCSA_BASE_URL:}
  port:
    base-url: ${PORT_EVENTS_BASE_URL:}
  accounting:
    base-url: ${ACCOUNTING_API_BASE_URL:}
  whatsapp:
    base-url: ${WHATSAPP_CLOUD_BASE_URL:https://graph.facebook.com}
    token: ${WHATSAPP_CLOUD_TOKEN:}
  edi:
    enabled: ${EDI_INTEGRATION_ENABLED:true}
    base-url: ${EDI_BASE_URL:}
  webhook:
    secret: ${INTEGRATION_WEBHOOK_SECRET:}
    allowed-hosts: ${INTEGRATION_WEBHOOK_ALLOWED_HOSTS:}
