name: AAL CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logiplatform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d logiplatform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redpanda:
        image: redpandadata/redpanda:v24.2.6
        ports: ["9092:9092"]
        options: >-
          --health-cmd "curl -f http://localhost:9644/v1/status/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
        command:
          - redpanda
          - start
          - --overprovisioned
          - --smp
          - '1'
          - --memory
          - 1G
          - --reserve-memory
          - 0M
          - --node-id
          - '0'
          - --check=false
          - --kafka-addr
          - internal://0.0.0.0:29092,external://0.0.0.0:9092
          - --advertise-kafka-addr
          - internal://redpanda:29092,external://localhost:9092
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/logiplatform
      DB_USERNAME: postgres
      DB_PASSWORD: test-password
      TEST_DB_PASSWORD: test-password
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      AAL_MAIL_ENABLED: false
      AAL_AUTH_OTP_REQUIRED: false
      SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Flyway history
        working-directory: .
        run: ./scripts/verify-migrations.sh
      - name: Maven verify
        run: mvn -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit --pretty false
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  shell-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        shell: bash
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Git whitespace check
        run: git diff --check
