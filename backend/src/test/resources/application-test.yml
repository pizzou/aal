spring:
  application:
    name: logiplatform-backend-test

  datasource:
    url: jdbc:postgresql://localhost:5432/logiplatform
    username: postgres
    password: Mpumuro@2025
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
      leak-detection-threshold: 0
      pool-name: LogiPlatformTestHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-at-least-32-bytes-long-for-hmac
  expiration-minutes: 60

notifications:
  smtp:
    enabled: false

flightstatus:
  aviationstack:
    enabled: false
    api-key:

app:
  environment: test
  auth:
    cookie:
      same-site: Lax

security:
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    com.logiplatform: INFO
